[workspace]
members = ["streaming"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Streamora Contributors"]
license = "MIT"
repository = "https://github.com/Strea-mora/Streamora.git"

[workspace.dependencies]
soroban-sdk = "21.7.7"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
